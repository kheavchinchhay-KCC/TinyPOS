<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Tiny POS · Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; }
      main { width: min(480px, 100%); padding: 30px; border: 1px solid #dbe3ef; border-radius: 22px; background: #fff; box-shadow: 0 24px 60px rgba(15, 23, 42, .12); text-align: center; }
      .icon { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center; background: #2563eb; color: #fff; font-size: 40px; font-weight: 900; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0 auto 20px; max-width: 360px; color: #64748b; line-height: 1.6; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        body { background: #07111f; color: #e2e8f0; }
        main { background: #0f1b2d; border-color: #26364d; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">T</div>
      <h1>Tiny POS is offline</h1>
      <p>
        Reconnect to the internet, then retry. An unfinished New Sale draft is kept on this device and can be restored after the app reconnects.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>Sales, payments and inventory changes require an online connection.</small>
    </main>
  </body>
</html>
