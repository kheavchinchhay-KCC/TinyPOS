[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Step 31 / Telegram notifications
[functions."telegram-notifications"]
  schedule = "*/15 * * * *"

# Step 43 / Customer CRM campaigns
[functions."customer-campaign-dispatch"]
  schedule = "*/15 * * * *"

# System health checks
[functions."system-health"]
  schedule = "0 */6 * * *"

# Step 46.25 / configurable automatic backups.
# The function wakes hourly and only processes organizations whose stored next_backup_at is due.
[functions."backup-scheduler"]
  schedule = "0 * * * *"

# Step 44 / Demand forecasting
[functions."demand-forecast-schedule"]
  schedule = "0 * * * *"

# Step 45 / Integration webhook delivery
[functions."integration-webhook-dispatch"]
  schedule = "*/5 * * * *"

# ---------------------------------------------------------------------------
# Existing API routes — preserved from the user's Step 43 netlify.toml
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200
  force = true

